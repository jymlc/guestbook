name: Verify Guestbook on Kubernetes and collect grading evidence
on:
  push:
    paths:
      - '.github/workflows/guestbook-proof.yml'
      - 'v1/guestbook/**'
      - 'verify-guestbook.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guestbook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: guestbook
      - name: Enable CPU metrics for autoscaling
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.0/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type=json -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s
      - name: Verify the container, autoscaler, rolling update, and rollback
        run: bash verify-guestbook.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guestbook-grading-evidence
          path: evidence/*.txt
          if-no-files-found: warn
